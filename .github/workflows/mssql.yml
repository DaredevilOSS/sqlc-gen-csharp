name: SQL Server (experimental)
defaults:
  run:
    shell: bash

env:
  WASI_SDK_VERSION: 25

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
    paths:
      - "**"
      - "!**.md"
      - "!benchmark/BenchmarkDotNet.Artifacts/**"

# The mssql engine is only on sqlc main and needs the patches in scripts/sqlc-patches, so the SQL Server examples
# are generated by their own config (sqlc.mssql.ci.yaml) with a sqlc built here. Their end-to-end tests run with
# the other databases in tests.yml / legacy-tests.yml.
jobs:
  build-sqlc:
    name: Build sqlc (main + patches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build sqlc
        run: ./scripts/sqlc-patches/build_sqlc.sh bin

      - uses: actions/upload-artifact@v7
        with:
          name: sqlc-mssql
          path: bin/

  codegen:
    name: Codegen (SQL Server)
    runs-on: ubuntu-latest
    needs: [build-sqlc]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: sqlc-mssql
          path: bin

      - run: chmod +x bin/*

      - name: Verify the generated yamls are synced
        run: |
          ./scripts/sync_sqlc_options.sh
          git diff --exit-code sqlc.mssql.local.generated.yaml sqlc.mssql.request.generated.yaml

      - name: Verify pushed generated code and requests are synced (process plugin)
        run: |
          dotnet publish LocalRunner -c release --output dist/
          bin/sqlc -f sqlc.mssql.local.generated.yaml diff
          bin/sqlc -f sqlc.mssql.request.generated.yaml diff

      - name: Install the WASI workload and SDK
        run: |
          dotnet workload install wasi-experimental
          folder="wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux"
          wget -q "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/$folder.tar.gz"
          tar xf "$folder.tar.gz"
          echo "WASI_SDK_PATH=$(pwd)/$folder" >> "$GITHUB_ENV"

      - name: Verify pushed generated code is synced (WASM plugin)
        run: |
          dotnet publish WasmRunner -c release
          ./scripts/wasm/copy_plugin_to.sh dist
          ./scripts/wasm/update_sha.sh sqlc.mssql.ci.yaml
          bin/sqlc -f sqlc.mssql.ci.yaml diff

      - name: Build the SQL Server examples
        run: |
          for project in examples/*Mssql*/*.csproj; do dotnet build "$project"; done

  syntax-matrix:
    name: T-SQL syntax matrix
    runs-on: ubuntu-latest
    needs: [build-sqlc]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Passw0rd!Test"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Passw0rd!Test' -Q 'SELECT 1'"
          --health-interval 5s --health-timeout 10s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: sqlc-mssql
          path: bin

      - run: chmod +x bin/*

      - name: Run the syntax matrix
        run: make mssql-syntax-matrix

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mssql-syntax-matrix
          path: |
            end2end/MssqlSyntaxMatrix/REPORT.md
            end2end/MssqlSyntaxMatrix/results.json

      - name: Verify the pushed report is up to date
        run: git diff --exit-code end2end/MssqlSyntaxMatrix/REPORT.md end2end/MssqlSyntaxMatrix/results.json
