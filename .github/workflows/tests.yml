name: .Net Core Tests
defaults:
  run:
    shell: bash
    
env:
  DOTNET_VERSION: '8.0.x'
  SQLC_VERSION: 1.30.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
    paths:
      - "**"
      - "!**.md"
      - "!benchmark/BenchmarkDotNet.Artifacts/**"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./unit-tests

    steps:
      - uses: actions/checkout@v7

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '${{ env.SQLC_VERSION }}'

      - name: Dotnet publish
        run: dotnet publish ../LocalRunner -c release --output dist/
        
      - name: Verify pushed generated code is synced
        run: sqlc diff
          
      - name: Run Tests
        run: |
          dotnet test RepositoryTests
          dotnet test CodegenTests
    
  end2end-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Load .env file
        uses: xom9ikk/dotenv@v2.4.0
        with:
          load-mode: strict

      - name: Docker compose
        uses: hoverkraft-tech/compose-action@v3.2.0

      - name: Run Tests
        run: ./end2end/scripts/run_tests.sh
