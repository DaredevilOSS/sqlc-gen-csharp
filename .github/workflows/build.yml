name: Build
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
    paths:
      - "**"
      - "!**.md"
      - "!benchmark/BenchmarkDotNet.Artifacts/**"

jobs:
  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: cat scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Load .env file
        uses: xom9ikk/dotenv@v2.4.0
        with:
          load-mode: strict

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: install Wasi workload
        run: dotnet workload install wasi-experimental

      - name: Setup Derived Variables
        run: |
          echo "WASI_SDK_FOLDER_NAME=wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux" >> $GITHUB_ENV
          echo "WASI_SDK_FILENAME=wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz" >> $GITHUB_ENV

      - name: Download Wasi SDK
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/${{ env.WASI_SDK_FILENAME }}
          tar xf ${{ env.WASI_SDK_FILENAME }}
          chmod -R 755 ${{ env.WASI_SDK_FILENAME }}

      - name: Dotnet Wasm Publish
        shell: bash
        run: |
          set -e
          WASI_SDK_PATH="$(pwd)/${{ env.WASI_SDK_FOLDER_NAME }}" dotnet publish WasmRunner -c release
          ./scripts/wasm/copy_plugin_to.sh dist

      - name: upload wasm plugin as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-file
          path: dist/plugin.wasm
          
  lint:
    name: Lint
    needs: [build-wasm]
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: .NET Lint
        uses: zyactions/dotnet-lint@v1
        with:
          implicit-restore: true
          workspace: sqlc-gen-csharp.sln
          exclude: |
            GeneratedProtobuf
            examples
            benchmark/*SqlcImpl

  codegen-tests:
     name: Codegen Tests
     runs-on: ubuntu-latest
     needs: [build-wasm]

     steps:
       - uses: actions/checkout@v7

       - name: Load tool versions
         run: cat scripts/tool-versions.env >> "$GITHUB_ENV"

       - name: Load .env file
         uses: xom9ikk/dotenv@v2.4.0
         with:
           load-mode: strict
      
       - name: Setup Dotnet
         uses: actions/setup-dotnet@v6
         with:
           global-json-file: global.json

       - uses: sqlc-dev/setup-sqlc@v5
         with:
           sqlc-version: '${{ env.SQLC_VERSION }}'

       - name: Verify pushed generated tests code is synced
         run: |
           ./end2end/scripts/generate_tests.sh
           git diff --quiet

       - uses: actions/download-artifact@v8
         with:
           name: wasm-file
           path: dist

       - name: Updating plugin sha
         run: ./scripts/wasm/update_sha.sh sqlc.ci.yaml

       - name: Verify pushed generated code is synced
         run: sqlc -f sqlc.ci.yaml diff

       - name: Verify pushed codegen requests are synced
         run: |
           dotnet publish LocalRunner -c release --output dist/
           sqlc -f sqlc.request.generated.yaml diff