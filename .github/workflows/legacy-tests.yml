name: .Net Framework Tests (Legacy)
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
    paths:
      - "**"
      - "!**.md"
      - "!benchmark/BenchmarkDotNet.Artifacts/**"

jobs:
  # As this can run only on Windows machines, these tests should run only in CI
  end2end-tests: 
    name: End-to-End Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The .NET Framework projects are built with the Visual Studio MSBuild, which is not guaranteed to support
      # the newest .NET SDK that the rest of the repository is pinned to by global.json - so build them with .NET 8
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Ignore global.json (pinned to the newer SDK)
        run: rm global.json
          
      - name: Load .env file
        uses: xom9ikk/dotenv@v2.4.0
        with:
          load-mode: strict

      - name: Setup Visual Studio for .NET Framework
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: 'latest'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3.1.0
        
      # PostgreSQL 17 and MySQL 8.0 come preinstalled on the Windows runner image - using them is much faster than
      # downloading and installing them (setup-postgres ~3.5 min, choco mysql ~2 min).
      # Both databases are started in the background while the test projects are restored and built.
      - name: Start databases in the background
        shell: pwsh
        run: |
          $pgBin = "$env:PGROOT\bin"
          $mysqlBin = 'C:\Program Files\MySQL\MySQL Server 8.0\bin'
          Set-Content -Path "$env:RUNNER_TEMP\start-dbs.ps1" -Value @"
          `$ErrorActionPreference = 'Stop'
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          `$env:PGPASSWORD = 'root'
          & '$pgBin\psql.exe' -U postgres -c "ALTER USER postgres PASSWORD '$env:POSTGRES_PASSWORD'"
          & '$pgBin\psql.exe' -U postgres -c "CREATE DATABASE $env:TESTS_DB"
          `$env:PGPASSWORD = '$env:POSTGRES_PASSWORD'
          & '$pgBin\psql.exe' -U postgres -d $env:TESTS_DB -f 'examples/config/postgresql/types/schema.sql' -f 'examples/config/postgresql/authors/schema.sql'

          & '$mysqlBin\mysqld.exe' --initialize-insecure --console --datadir=C:\mysql-data
          Start-Process -FilePath '$mysqlBin\mysqld.exe' -ArgumentList '--console','--datadir=C:\mysql-data','--local-infile=1' -WindowStyle Hidden
          for (`$i = 0; `$i -lt 60; `$i++) { & '$mysqlBin\mysqladmin.exe' -u root ping 2>`$null; if (`$LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 1 }
          & '$mysqlBin\mysql.exe' -u root -e "SET GLOBAL local_infile=1; CREATE DATABASE $env:TESTS_DB;"
          & '$mysqlBin\mysql.exe' -u root $env:TESTS_DB --execute="source examples/config/mysql/types/schema.sql; source examples/config/mysql/authors/schema.sql;"
          "@
          Start-Process -FilePath pwsh -ArgumentList '-NoProfile','-File',"$env:RUNNER_TEMP\start-dbs.ps1" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\dbs.log" -RedirectStandardError "$env:RUNNER_TEMP\dbs.err.log" -WindowStyle Hidden

      - name: Restore and build test projects
        shell: pwsh
        run: |
          Get-ChildItem -Path examples -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -like '*Legacy*' } |
            ForEach-Object { nuget restore $_.FullName }
          nuget restore ./end2end/EndToEndCommon/EndToEndCommon.csproj
          nuget restore ./end2end/EndToEndTestsLegacy/EndToEndTestsLegacy.csproj
          msbuild.exe ./end2end/EndToEndTestsLegacy/EndToEndTestsLegacy.csproj -p:Configuration=Release -p:FrameworkVersion=v4.7.2 -m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for databases
        shell: pwsh
        run: |
          $mysqlBin = 'C:\Program Files\MySQL\MySQL Server 8.0\bin'
          $env:PGPASSWORD = $env:POSTGRES_PASSWORD
          for ($i = 0; $i -lt 120; $i++) {
            $pg = & "$env:PGROOT\bin\psql.exe" -U postgres -d $env:TESTS_DB -tAc "select to_regclass('public.authors') is not null" 2>$null
            $my = & "$mysqlBin\mysql.exe" -u root -N -e "select count(*) from information_schema.tables where table_schema='$env:TESTS_DB'" 2>$null
            if ($pg -eq 't' -and [int]$my -gt 0) { Write-Host "databases ready"; exit 0 }
            Start-Sleep -Seconds 2
          }
          Get-Content "$env:RUNNER_TEMP\dbs.log", "$env:RUNNER_TEMP\dbs.err.log" -ErrorAction SilentlyContinue
          exit 1

      - name: Run Tests
        shell: powershell
        run: |
          $path = vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.ManagedDesktop Microsoft.VisualStudio.Workload.Web -requiresAny -property installationPath
          $path = join-path $path 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          & $path ./end2end/EndToEndTestsLegacy/bin/Release/net472/EndToEndTestsLegacy.dll